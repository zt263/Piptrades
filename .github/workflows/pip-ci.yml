name: Pip CI

on:
  push:
    branches: [main, pip-v1]
    paths:
      - "src/pip/**"
      - "pip_app.py"
      - "static/pip.html"
      - "tests/test_pip.py"
      - "requirements-pip.txt"
      - "Dockerfile"
      - "railway.toml"
      - ".github/workflows/pip-ci.yml"
  pull_request:
    paths:
      - "src/pip/**"
      - "pip_app.py"
      - "static/pip.html"
      - "tests/test_pip.py"
      - "requirements-pip.txt"
      - "Dockerfile"
      - "railway.toml"
      - ".github/workflows/pip-ci.yml"

jobs:
  pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pip.txt pytest
      - name: Compile
        run: python -m py_compile src/pip/*.py pip_app.py
      - name: Test
        run: PYTHONPATH=. pytest -q tests/test_pip.py
      - name: Validate dashboard JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('static/pip.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start + 8);
          if (start < 0 || end < 0) throw new Error('dashboard script not found');
          new Function(html.slice(start + 8, end));
          console.log('dashboard JavaScript parses');
          NODE
