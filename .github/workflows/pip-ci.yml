name: Pip CI

on:
  push:
    branches: [main, pip-v1]
    paths:
      - "src/pip/**"
      - "pip_app.py"
      - "tests/test_pip.py"
      - "requirements-pip.txt"
      - "Dockerfile"
      - "railway.toml"
      - ".github/workflows/pip-ci.yml"
  pull_request:
    paths:
      - "src/pip/**"
      - "pip_app.py"
      - "tests/test_pip.py"
      - "requirements-pip.txt"
      - "Dockerfile"
      - "railway.toml"
      - ".github/workflows/pip-ci.yml"

jobs:
  pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pip.txt pytest
      - name: Compile
        run: python -m py_compile src/pip/*.py pip_app.py
      - name: Test
        run: PYTHONPATH=. pytest -q tests/test_pip.py
